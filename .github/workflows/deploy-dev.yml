name: Deploy to Development

on:
  push:
    branches:
      - main

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-development
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=dev-latest
            type=raw,value=dev-{{date 'YYYYMMDD-HHmmss'}}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_ENV=development
      
      - name: Generate build summary
        run: |
          echo "## Docker Image Built Successfully :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  deploy-development:
    name: Deploy to Development Environment
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: development
      url: https://collegeathletebase-dev.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}
      
      - name: Install AWS CLI
        run: |
          echo "AWS CLI version:"
          aws --version
      
      - name: Fetch secrets from Secrets Manager
        id: secrets
        run: |
          echo "Fetching environment variables from Secrets Manager..."

          DB_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "development/college-athlete-base/db-credentials" \
            --query 'SecretString' --output text)

          JWT_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "development/college-athlete-base/jwt-secret" \
            --query 'SecretString' --output text)

          STRIPE_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "development/college-athlete-base/stripe-keys" \
            --query 'SecretString' --output text)

          # Parse individual values (never echo secret values)
          DB_HOST=$(echo "$DB_SECRET" | jq -r '.host')
          DB_PORT=$(echo "$DB_SECRET" | jq -r '.port')
          DB_NAME=$(echo "$DB_SECRET" | jq -r '.database')
          DB_USER=$(echo "$DB_SECRET" | jq -r '.username')
          DB_PASS=$(echo "$DB_SECRET" | jq -r '.password')
          JWT_VALUE=$(echo "$JWT_SECRET" | jq -r '.secret')
          STRIPE_PUB=$(echo "$STRIPE_SECRET" | jq -r '.publishable_key')
          STRIPE_SEC=$(echo "$STRIPE_SECRET" | jq -r '.secret_key')
          STRIPE_WEBHOOK=$(echo "$STRIPE_SECRET" | jq -r '.webhook_secret')
          STRIPE_MONTHLY=$(echo "$STRIPE_SECRET" | jq -r '.monthly_price_id')
          STRIPE_ANNUAL=$(echo "$STRIPE_SECRET" | jq -r '.annual_price_id')

          # Mask all secret values in logs
          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$JWT_VALUE"
          echo "::add-mask::$STRIPE_SEC"
          echo "::add-mask::$STRIPE_WEBHOOK"

          # Export as step outputs for use in task definition update
          echo "db-host=$DB_HOST" >> $GITHUB_OUTPUT
          echo "db-port=$DB_PORT" >> $GITHUB_OUTPUT
          echo "db-name=$DB_NAME" >> $GITHUB_OUTPUT
          echo "db-user=$DB_USER" >> $GITHUB_OUTPUT
          echo "db-pass=$DB_PASS" >> $GITHUB_OUTPUT
          echo "jwt-secret=$JWT_VALUE" >> $GITHUB_OUTPUT
          echo "stripe-pub=$STRIPE_PUB" >> $GITHUB_OUTPUT
          echo "stripe-sec=$STRIPE_SEC" >> $GITHUB_OUTPUT
          echo "stripe-webhook=$STRIPE_WEBHOOK" >> $GITHUB_OUTPUT
          echo "stripe-monthly=$STRIPE_MONTHLY" >> $GITHUB_OUTPUT
          echo "stripe-annual=$STRIPE_ANNUAL" >> $GITHUB_OUTPUT

          echo "✅ Secrets fetched from Secrets Manager"

      - name: Create new ECS task definition
        id: task-def
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          echo "Creating new ECS task definition for development..."
          
          # Get current task definition
          CURRENT_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition ${{ secrets.DEV_ECS_TASK_FAMILY }} \
            --query 'taskDefinition' \
            --output json)

          # Fetch Auth and Payment Lambda URLs from CloudFormation stack outputs
          AUTH_LAMBDA_URL=$(aws cloudformation describe-stacks \
            --stack-name DevStack \
            --query "Stacks[0].Outputs[?ExportName=='development-auth-lambda-url'].OutputValue" \
            --output text)

          PAYMENT_LAMBDA_URL=$(aws cloudformation describe-stacks \
            --stack-name DevStack \
            --query "Stacks[0].Outputs[?ExportName=='development-payment-webhook-url'].OutputValue" \
            --output text)
          
          # Create new task definition with updated image and injected env vars from Secrets Manager
          NEW_TASK_DEF=$(echo "$CURRENT_TASK_DEF" | jq \
            --arg IMAGE "$IMAGE_TAG" \
            --arg RUNTIME_ENV "development" \
            --arg AUTH_LAMBDA_URL "$AUTH_LAMBDA_URL" \
            --arg PAYMENT_LAMBDA_URL "$PAYMENT_LAMBDA_URL" \
            --arg DB_HOST "${{ steps.secrets.outputs.db-host }}" \
            --arg DB_PORT "${{ steps.secrets.outputs.db-port }}" \
            --arg DB_NAME "${{ steps.secrets.outputs.db-name }}" \
            --arg DB_USER "${{ steps.secrets.outputs.db-user }}" \
            --arg DB_PASS "${{ steps.secrets.outputs.db-pass }}" \
            --arg JWT_SECRET "${{ steps.secrets.outputs.jwt-secret }}" \
            --arg STRIPE_PUB "${{ steps.secrets.outputs.stripe-pub }}" \
            --arg STRIPE_SEC "${{ steps.secrets.outputs.stripe-sec }}" \
            --arg STRIPE_WEBHOOK "${{ steps.secrets.outputs.stripe-webhook }}" \
            --arg STRIPE_MONTHLY "${{ steps.secrets.outputs.stripe-monthly }}" \
            --arg STRIPE_ANNUAL "${{ steps.secrets.outputs.stripe-annual }}" \
            '
            .containerDefinitions[0].image = $IMAGE |
            .containerDefinitions[0].environment = (
              (.containerDefinitions[0].environment // []) |
              map(select(.name | IN(
                "RUNTIME_ENV","AUTH_LAMBDA_URL","PAYMENT_LAMBDA_URL",
                "DATABASE_HOST","DATABASE_PORT","DATABASE_NAME","DATABASE_USER","DATABASE_PASSWORD",
                "JWT_SECRET","NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY","STRIPE_SECRET_KEY",
                "STRIPE_WEBHOOK_SECRET","STRIPE_MONTHLY_PRICE_ID","STRIPE_ANNUAL_PRICE_ID",
                "NEXT_PUBLIC_APP_URL"
              ) | not)
            ) + [
              {"name": "RUNTIME_ENV",                       "value": $RUNTIME_ENV},
              {"name": "AUTH_LAMBDA_URL",                   "value": $AUTH_LAMBDA_URL},
              {"name": "PAYMENT_LAMBDA_URL",                "value": $PAYMENT_LAMBDA_URL},
              {"name": "DATABASE_HOST",                     "value": $DB_HOST},
              {"name": "DATABASE_PORT",                     "value": $DB_PORT},
              {"name": "DATABASE_NAME",                     "value": $DB_NAME},
              {"name": "DATABASE_USER",                     "value": $DB_USER},
              {"name": "DATABASE_PASSWORD",                 "value": $DB_PASS},
              {"name": "JWT_SECRET",                        "value": $JWT_SECRET},
              {"name": "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY","value": $STRIPE_PUB},
              {"name": "STRIPE_SECRET_KEY",                 "value": $STRIPE_SEC},
              {"name": "STRIPE_WEBHOOK_SECRET",             "value": $STRIPE_WEBHOOK},
              {"name": "STRIPE_MONTHLY_PRICE_ID",           "value": $STRIPE_MONTHLY},
              {"name": "STRIPE_ANNUAL_PRICE_ID",            "value": $STRIPE_ANNUAL},
              {"name": "NEXT_PUBLIC_APP_URL",               "value": "https://collegeathletebase-dev.com"}
            ]) |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ')
          
          # Register new task definition
          NEW_TASK_DEF_ARN=$(echo "$NEW_TASK_DEF" | \
            aws ecs register-task-definition \
              --cli-input-json file:///dev/stdin \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)
          
          echo "new-task-def-arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "✅ New task definition registered: $NEW_TASK_DEF_ARN"
      
      - name: Deploy to development environment
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          echo "Deploying to development ECS service..."
          echo "Image: $IMAGE_TAG"
          echo "Task Definition: ${{ steps.task-def.outputs.new-task-def-arn }}"
          
          # Update ECS service with new task definition
          aws ecs update-service \
            --cluster ${{ secrets.DEV_ECS_CLUSTER }} \
            --service ${{ secrets.DEV_ECS_SERVICE }} \
            --task-definition ${{ steps.task-def.outputs.new-task-def-arn }} \
            --force-new-deployment \
            --enable-execute-command
          
          echo "✅ ECS service update initiated"
      
      - name: Wait for deployment to stabilize
        run: |
          echo "Waiting for ECS deployment to complete..."
          
          # Wait for ECS service to reach steady state
          aws ecs wait services-stable \
            --cluster ${{ secrets.DEV_ECS_CLUSTER }} \
            --services ${{ secrets.DEV_ECS_SERVICE }}
          
          echo "✅ ECS deployment reached steady state"
      
      - name: Run health checks
        run: |
          echo "Running health checks on development environment..."
          
          # Health check endpoint
          HEALTH_URL="https://collegeathletebase-dev.com/api/health"
          MAX_RETRIES=10
          RETRY_DELAY=10
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
            
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Health check passed! Application is healthy."
              exit 0
            fi
            
            echo "⚠️  Health check failed with status: $HTTP_STATUS"
            
            if [ $i -lt $MAX_RETRIES ]; then
              echo "Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done
          
          echo "❌ Health checks failed after $MAX_RETRIES attempts"
          exit 1
      
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, initiating rollback..."
          
          # Get previous task definition
          PREVIOUS_TASK_DEF=$(aws ecs describe-services \
            --cluster ${{ secrets.DEV_ECS_CLUSTER }} \
            --services ${{ secrets.DEV_ECS_SERVICE }} \
            --query 'services[0].deployments[1].taskDefinition' \
            --output text)
          
          if [ -n "$PREVIOUS_TASK_DEF" ] && [ "$PREVIOUS_TASK_DEF" != "None" ]; then
            echo "Rolling back to: $PREVIOUS_TASK_DEF"
            
            aws ecs update-service \
              --cluster ${{ secrets.DEV_ECS_CLUSTER }} \
              --service ${{ secrets.DEV_ECS_SERVICE }} \
              --task-definition "$PREVIOUS_TASK_DEF" \
              --force-new-deployment
            
            echo "✅ Rollback initiated"
          else
            echo "⚠️  No previous task definition found for rollback"
          fi
      
      - name: Generate deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Deployment Successful :white_check_mark:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** Development" >> $GITHUB_STEP_SUMMARY
            echo "**URL:** https://collegeathletebase-dev.com" >> $GITHUB_STEP_SUMMARY
            echo "**Image:** \`${{ needs.build-and-push.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Deployment Failed :x:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** Development" >> $GITHUB_STEP_SUMMARY
            echo "**Image:** \`${{ needs.build-and-push.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Rollback has been initiated." >> $GITHUB_STEP_SUMMARY
          fi

  deploy-lambdas:
    name: Build and Deploy Lambda Functions
    runs-on: ubuntu-latest
    needs: deploy-development
    environment:
      name: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            infrastructure/lambdas/auth/package-lock.json
            infrastructure/lambdas/payment/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}

      - name: Build auth Lambda
        working-directory: infrastructure/lambdas/auth
        run: |
          npm ci --include=dev
          npm run build
          echo "✅ Auth Lambda built"

      - name: Deploy auth Lambda
        working-directory: infrastructure/lambdas/auth
        run: |
          # Package the dist directory into a zip for Lambda deployment
          cd dist && zip -r ../auth-lambda.zip . && cd ..
          aws lambda update-function-code \
            --function-name "development-college-athlete-base-auth" \
            --zip-file fileb://auth-lambda.zip \
            --publish
          echo "✅ Auth Lambda deployed"

      - name: Wait for auth Lambda update to complete
        run: |
          aws lambda wait function-updated \
            --function-name "development-college-athlete-base-auth"
          echo "✅ Auth Lambda update complete"

      - name: Build payment Lambda
        working-directory: infrastructure/lambdas/payment
        run: |
          npm ci --include=dev
          npm run build
          echo "✅ Payment Lambda built"

      - name: Deploy payment Lambda
        working-directory: infrastructure/lambdas/payment
        run: |
          cd dist && zip -r ../payment-lambda.zip . && cd ..
          aws lambda update-function-code \
            --function-name "development-college-athlete-base-payment" \
            --zip-file fileb://payment-lambda.zip \
            --publish
          echo "✅ Payment Lambda deployed"

      - name: Wait for payment Lambda update to complete
        run: |
          aws lambda wait function-updated \
            --function-name "development-college-athlete-base-payment"
          echo "✅ Payment Lambda update complete"

      - name: Generate Lambda deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Lambda Deployment Successful :white_check_mark:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Lambda | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| development-college-athlete-base-auth | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
            echo "| development-college-athlete-base-payment | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Lambda Deployment Failed :x:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "ECS deployment succeeded but Lambda deployment failed." >> $GITHUB_STEP_SUMMARY
            echo "Auth and payment flows may be degraded in the development environment." >> $GITHUB_STEP_SUMMARY
          fi

  notify:
    name: Send Deployment Notifications
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-development, deploy-lambdas]
    if: always()
    
    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy-development.result }}" = "success" ]; then
            echo "✅ Development deployment successful"
            # Add notification logic here (Slack, email, etc.)
            # Example for Slack:
            # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            #   -H 'Content-Type: application/json' \
            #   -d '{
            #     "text": "✅ Development deployment successful",
            #     "blocks": [
            #       {
            #         "type": "section",
            #         "text": {
            #           "type": "mrkdwn",
            #           "text": "*Development Deployment Successful*\n\nCommit: `${{ github.sha }}`\nURL: https://collegeathletebase-dev.com"
            #         }
            #       }
            #     ]
            #   }'
          else
            echo "❌ Development deployment failed"
            # Add failure notification logic here
          fi
